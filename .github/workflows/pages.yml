# Publishes the playground to GitHub Pages.
# One-time setup: Settings → Pages → Source: "GitHub Actions".
name: Playground

# Runs only when you ask for it: push a version tag (v1.2.3) or Actions → Playground → Run workflow.
# A tag deploy needs the github-pages environment to accept tags: Settings → Environments →
# github-pages → Deployment branches and tags → add a tag rule `v*.*.*`.
on:
  push:
    tags: ['v*.*.*']
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v5
      - name: Assemble the site
        run: |
          mkdir -p _site
          cp -r site/. _site/
          cp -r src _site/src
          cp -r docs/gallery _site/gallery
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - id: deployment
        uses: actions/deploy-pages@v4
