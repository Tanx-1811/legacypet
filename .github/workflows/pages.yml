# Publishes the playground to GitHub Pages.
# One-time setup: Settings → Pages → Source: "GitHub Actions".
name: Playground

on:
  push:
    branches: [main]
    paths: ['site/**', 'src/**', 'docs/gallery/**']
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - name: Assemble the site
        run: |
          mkdir -p _site
          cp -r site/. _site/
          cp -r src _site/src
          cp -r docs/gallery _site/gallery
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - id: deployment
        uses: actions/deploy-pages@v4
