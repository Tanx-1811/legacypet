# Builds the desktop app for macOS, Windows and Linux.
# - When a release is published, the installers are attached to it, so the download page's
#   links (releases/latest/download/…) always point at the newest app.
# - Run it by hand from the Actions tab to get the installers as workflow artifacts.
# Signing is optional (see "Sign the desktop app" in CONTRIBUTING.md):
# - macOS: MAC_CERT_P12 (base64 of a Developer ID Application .p12), MAC_CERT_PASSWORD, APPLE_ID,
#   APPLE_APP_SPECIFIC_PASSWORD and APPLE_TEAM_ID sign and notarize the app. Without them it is signed ad hoc.
# - Windows: WIN_CERT_PFX (base64 of a code signing .pfx) and WIN_CERT_PASSWORD sign the installer.
name: Desktop app

on:
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: write # attach the installers to the release

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, windows-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: bash
        working-directory: desktop
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: desktop/package-lock.json
      - run: npm ci

      - name: Build the installers
        env:
          MAC_CERT_P12: ${{ secrets.MAC_CERT_P12 }}
          MAC_CERT_PASSWORD: ${{ secrets.MAC_CERT_PASSWORD }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          WIN_CERT_PFX: ${{ secrets.WIN_CERT_PFX }}
          WIN_CERT_PASSWORD: ${{ secrets.WIN_CERT_PASSWORD }}
        run: |
          # Each system gets only its own certificate. Missing secrets are empty: drop them.
          for v in APPLE_ID APPLE_APP_SPECIFIC_PASSWORD APPLE_TEAM_ID; do
            if [ -z "${!v}" ] || [ "$RUNNER_OS" != "macOS" ]; then unset "$v"; fi
          done
          extra=()
          if [ "$RUNNER_OS" = "macOS" ]; then
            if [ -n "$MAC_CERT_P12" ]; then
              export CSC_LINK="$MAC_CERT_P12" CSC_KEY_PASSWORD="$MAC_CERT_PASSWORD"
            else
              # No certificate: sign ad hoc, so macOS offers "Open Anyway" instead of calling the app damaged.
              extra=(-c.mac.identity=- -c.mac.hardenedRuntime=false)
            fi
          elif [ "$RUNNER_OS" = "Windows" ] && [ -n "$WIN_CERT_PFX" ]; then
            export WIN_CSC_LINK="$WIN_CERT_PFX" WIN_CSC_KEY_PASSWORD="$WIN_CERT_PASSWORD"
          fi
          unset MAC_CERT_P12 MAC_CERT_PASSWORD WIN_CERT_PFX WIN_CERT_PASSWORD
          npm run dist -- --publish never "${extra[@]}"
          ls -la dist

      # Opens the freshly built app, which saves pictures of its own windows and quits.
      - name: Smoke test
        env:
          LEGACYPET_HOME: ${{ runner.temp }}/legacypet-home
          LEGACYPET_SMOKE: ${{ runner.temp }}/smoke
        run: |
          case "$RUNNER_OS" in
            macOS) dir=dist/mac-arm64; [ -d "$dir" ] || dir=dist/mac; "$dir/LegacyPet.app/Contents/MacOS/LegacyPet" ;;
            Windows) ./dist/win-unpacked/LegacyPet.exe ;;
            Linux) sudo apt-get install -y xvfb >/dev/null && xvfb-run -a ./dist/linux-unpacked/legacypet --no-sandbox ;;
          esac
          cat "$LEGACYPET_SMOKE/smoke.json"
          grep -q '"ok": true' "$LEGACYPET_SMOKE/smoke.json"

      - uses: actions/upload-artifact@v4
        with:
          name: LegacyPet-${{ runner.os }}
          path: |
            desktop/dist/LegacyPet-*.dmg
            desktop/dist/LegacyPet-*.exe
            desktop/dist/LegacyPet-*.AppImage
            desktop/dist/LegacyPet-*.deb
            ${{ runner.temp }}/smoke/*.png
          if-no-files-found: error

      - name: Attach to the release
        if: github.event_name == 'release'
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.event.release.tag_name }}
        run: |
          shopt -s nullglob
          files=(dist/LegacyPet-*.dmg dist/LegacyPet-*.exe dist/LegacyPet-*.AppImage dist/LegacyPet-*.deb)
          gh release upload "$TAG" "${files[@]}" --clobber
