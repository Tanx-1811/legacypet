# LegacyPet's own pet. If this repo is neglected, you'll see it on the README.
name: LegacyPet

on:
  schedule:
    - cron: '17 */6 * * *'
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: write
  actions: write
  issues: read
  pull-requests: read
  checks: read
  statuses: read

jobs:
  legacypet:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: ./
