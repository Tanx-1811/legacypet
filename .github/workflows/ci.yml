name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node: [20, 22, 24]
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: ${{ matrix.node }}
      - run: node --test
      - name: Gallery renders
        run: node src/cli.js gallery --out /tmp/gallery
      # Rendering is deterministic, so a fresh render must equal the committed docs/gallery
      # (same files, same bytes, nothing stale). `npm run gallery` regenerates it.
      - name: docs/gallery is up to date
        run: diff -rq docs/gallery /tmp/gallery || { echo "::error::docs/gallery is out of date. Run 'npm run gallery' and commit the result."; exit 1; }

  action:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Run the action in dry-run mode
        id: pet
        uses: ./
        with:
          dry-run: 'true'
      - run: echo "Our pet is ${{ steps.pet.outputs.mood }} at level ${{ steps.pet.outputs.level }}"
