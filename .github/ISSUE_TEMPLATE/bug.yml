name: 🐛 Bug report
description: The pet looks wrong, says something odd, or the action fails
labels: [bug]
body:
  - type: input
    id: repo
    attributes:
      label: Repository
      description: The repo whose pet misbehaves (if public)
      placeholder: owner/name
  - type: textarea
    id: what
    attributes:
      label: What happened?
      description: Include a screenshot of the pet and, if the action failed, the log output.
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: What did you expect?
  - type: textarea
    id: workflow
    attributes:
      label: Your workflow file
      render: yaml
