<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>LegacyPet</title>
<meta name="color-scheme" content="light dark">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<style>
  :root { --text: #18181b; --bubble: #ffffff; --border: #e6e6ea; --accent: #0b7f75; --bg: #f7f7f9; color-scheme: light; }
  @media (prefers-color-scheme: dark) { :root { --text: #ededf0; --bubble: #131318; --border: #26262e; --accent: #2fd4bd; --bg: #0b0b0f; color-scheme: dark; } }
  html, body { margin: 0; height: 100%; overflow: hidden; font: 12px/1.35 ui-sans-serif, system-ui, -apple-system, "Segoe UI", sans-serif; color: var(--text); user-select: none; }
  body { background: var(--bg); }
  /* The desktop app's window is see-through: only the pet shows. */
  .transparent body, html.transparent { background: transparent; }
  .wrap { height: 100%; display: grid; grid-template-rows: auto 1fr auto; justify-items: center; align-items: end; padding: 6px; box-sizing: border-box; -webkit-app-region: drag; cursor: grab; }
  .bubble { max-width: min(200px, 94vw); background: var(--bubble); border: 1px solid var(--border); border-radius: 12px; padding: 5px 9px; box-shadow: 0 4px 14px rgba(0,0,0,.15); opacity: 0; transform: translateY(4px); transition: opacity .2s, transform .2s; text-align: center; }
  .bubble.show { opacity: 1; transform: none; }
  .pet { width: var(--pet-w, 132px); height: auto; display: block; image-rendering: pixelated; filter: drop-shadow(0 4px 6px rgba(0,0,0,.18)); }
  .bar { display: flex; gap: 4px; opacity: 0; transition: opacity .15s; -webkit-app-region: no-drag; }
  body:hover .bar, .bar:focus-within { opacity: 1; }
  .bar button { border: 1px solid var(--border); background: var(--bubble); color: var(--text); border-radius: 99px; width: 30px; height: 30px; font-size: 15px; cursor: pointer; padding: 0; }
  .bar button:hover { border-color: var(--accent); }
  .empty { padding: 20px; text-align: center; }
  @media (prefers-reduced-motion: reduce) { .bubble { transition: none; } }
</style>
</head>
<body>
<div class="wrap">
  <div class="bubble" id="bubble" role="status"></div>
  <img class="pet" id="pet" alt="">
  <div class="bar" id="bar"></div>
</div>
<script type="module" src="float.js"></script>
</body>
</html>
