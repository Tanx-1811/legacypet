# Copy this file to .github/workflows/legacypet.yml in your repository.
name: LegacyPet

on:
  schedule:
    - cron: '17 */6 * * *' # check on the pet four times a day
  release:
    types: [published] # throw a party the moment you ship
  workflow_dispatch: # "Run workflow" button for impatient owners
  issue_comment:
    types: [created] # talk to your pet: /pet, /pet feed, /pet play, /pet quests

permissions:
  contents: write # publish the pet to the `legacypet` branch
  actions: write # keep the schedule alive while the repo sleeps
  issues: write # answer /pet in issues
  pull-requests: write # ...and in pull requests
  checks: read
  statuses: read

jobs:
  legacypet:
    if: github.event_name != 'issue_comment' || startsWith(github.event.comment.body, '/pet')
    runs-on: ubuntu-latest
    steps:
      - uses: Tanx-1811/legacypet@v1
        with:
          lang: en # en | vi | ja | zh | ko | es | fr
          # species: ninja   # auto | blob | cat | duck | crab | octopus | snake | cactus
          #                  # | ninja | mecha | dragon | bunny | bat | hero
          # name: Mochi      # leave empty and the repo names its own pet
          # scenery: beach   # auto | meadow | garden | pond | beach | reef | jungle | desert
          # alerts: true     # open an issue when the pet stays sick or turns zombie
          # vacation: until 2027-01-05  # going away? the pet won't starve meanwhile
          # wear: cap, bird  # dress it up with unlocked items (see /pet wardrobe)
